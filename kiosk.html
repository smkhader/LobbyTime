<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LobbyTime</title><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:Segoe UI, Arial, sans-serif;background-color:#0b1220;}.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.18);pointer-events:none}.container{position:relative;text-align:center;width:100%}.time{font-size:9vw;font-weight:600;letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,0.6)}.date{font-size:3vw;margin-top:.5rem;opacity:.95;text-shadow:0 2px 6px rgba(0,0,0,0.6)}</style></head><body><div class="overlay"></div><div class="container"><div class="time" id="time">--:--</div><div class="date" id="date">Loading...</div></div><script>
function pad(n){return n.toString().padStart(2,'0')}function mn(){return ['January','February','March','April','May','June','July','August','September','October','November','December']}function ms(){return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']}function wn(){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']}function ws(){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']}function fmt(d,f){return f.replace(/YYYY|YY|MMMM|MMM|MM|M|DD|D|dddd|ddd|HH|hh|mm|ss|A/g,function(t){switch(t){case'YYYY':return d.getFullYear();case'YY':return String(d.getFullYear()).slice(-2);case'MMMM':return mn()[d.getMonth()];case'MMM':return ms()[d.getMonth()];case'MM':return pad(d.getMonth()+1);case'M':return d.getMonth()+1;case'DD':return pad(d.getDate());case'D':return d.getDate();case'dddd':return wn()[d.getDay()];case'ddd':return ws()[d.getDay()];case'HH':return pad(d.getHours());case'hh':var h=d.getHours()%12;return pad(h===0?12:h);case'mm':return pad(d.getMinutes());case'ss':return pad(d.getSeconds());case'A':return d.getHours()>=12?'PM':'AM'}})}var tf='hh:mm:ss A',df='dddd, MMMM D, YYYY';function update(){var d=new Date();document.getElementById('time').textContent=fmt(d,tf);document.getElementById('date').textContent=fmt(d,df)}update();setInterval(update,1000);
</script></body></html>
